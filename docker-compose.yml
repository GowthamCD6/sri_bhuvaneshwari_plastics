services:
  sbp-frontend:
    container_name: sbp-frontend
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    image: pcdpbit/sbp-frontend:${DOCKER_IMG_VERSION}
    restart: unless-stopped
    depends_on:
      - sbp-backend
    ports:
      - "8085:80"

  sbp-backend:
    container_name: sbp-backend
    build:
      context: ./server
    image: pcdpbit/sbp-backend:${DOCKER_IMG_VERSION}
    env_file:
      - ./.env
    ports:
      - "5005:5000"
    volumes:
      - /opt/sbp/uploads:/usr/src/app/uploads
    depends_on:
      sbp-mysql:
        condition: service_healthy

  sbp-mysql:
    container_name: sbp-mysql
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
